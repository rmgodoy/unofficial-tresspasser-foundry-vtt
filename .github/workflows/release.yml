name: Release System

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use "v" + system.json version)'
        required: false
        type: string
      draft:
        description: 'Publish as draft?'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build compendium packs
        run: npm run pack

      - name: Prepare release metadata
        id: prepare
        run: node .github/scripts/prepare-release.mjs
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}

      - name: Package system zip
        run: |
          mkdir -p staging/trespasser

          # Copy root files
          cp system.json staging/trespasser/
          cp trespasser.mjs staging/trespasser/
          [ -f README.md ] && cp README.md staging/trespasser/
          [ -f CHANGELOG.md ] && cp CHANGELOG.md staging/trespasser/
          [ -f glossary.json ] && cp glossary.json staging/trespasser/

          # Copy directories
          cp -r module staging/trespasser/
          cp -r styles staging/trespasser/
          cp -r templates staging/trespasser/
          cp -r lang staging/trespasser/
          cp -r assets staging/trespasser/
          cp -r packs staging/trespasser/

          # Create zip archive containing trespasser/ folder
          cd staging
          zip -r ../system.zip trespasser
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.prepare.outputs.tag }}
          body_path: release_notes.md
          files: |
            system.json
            system.zip
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}
